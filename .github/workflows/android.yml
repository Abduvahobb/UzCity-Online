# Telefon ilovasi (APK) avtomatik yig‘iladi: o‘yin fayllari o‘zgarganda yoki
# Actions bo‘limida "Run workflow" bosilganda.
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Kutubxonalarni o‘rnatish
        run: |
          npm install
          npm install --no-save @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0

      - name: O‘yin fayllarini tayyorlash
        run: |
          rm -rf www
          cp -r public www
          mkdir -p www/vendor
          cp node_modules/three/build/three.module.js www/vendor/

      - name: Android loyihasini yaratish
        run: |
          npx cap add android
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />#' $MANIFEST
          sed -i 's#android:launchMode="singleTask"#& android:screenOrientation="sensorLandscape"#' $MANIFEST
          grep -n "RECORD_AUDIO\|screenOrientation" $MANIFEST
          npx cap sync android

      - name: APK yig‘ish
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../UzCity.apk

      - uses: actions/upload-artifact@v4
        with:
          name: UzCity-apk
          path: UzCity.apk

      - name: Releases bo‘limiga joylash
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: UzCity APK ${{ github.run_number }}
          body: Telefon uchun UzCity o‘yini. UzCity.apk faylini yuklab oling va telefoningizga o‘rnating.
          files: UzCity.apk
          make_latest: true
